plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id "io.freefair.lombok" version "8.6"
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "$projectDir/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { property 'forge.enabledGameTestNamespaces', mod_id }
        gameTestServer { property 'forge.enabledGameTestNamespaces', mod_id }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url 'https://modmaven.dev/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:$minecraft_version-$forge_version"

    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:$curios_version:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:$curios_version")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:$jei_version")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:$jei_version")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:$jei_version")

    runtimeOnly fg.deobf("mekanism:Mekanism:${mekanism_version}")
}

var generatedMainResourcesDir = file('./build/generated/resources/main')

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [minecraft_version: minecraft_version, forge_version: forge_version,
                             mod_id           : mod_id, mod_name: mod_name, mod_version: mod_version,
                             curios_version   : curios_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    sourceSets.main.resources.srcDir generatedMainResourcesDir
    dependsOn('generateTextures')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title'   : mod_id, 'Specification-Vendor': 'AA8043',
                    'Specification-Version' : '1', 'Implementation-Title': project.name,
                    'Implementation-Version': archiveVersion, 'Implementation-Vendor': 'AA8043'])
    }
}

tasks.register('generateTextures') {
    def scripts = fileTree('./scripts/generate-textures') { include '*.ps1' }
    def textureOutput = new File(generatedMainResourcesDir, "assets/$mod_id/textures")
    inputs.files(scripts)
    outputs.dir(textureOutput)

    doFirst {
        if (textureOutput.exists()) {
            textureOutput.deleteDir()
        }
        textureOutput.mkdirs()
    }

    doLast {
        scripts.files.sort().each { script ->
            exec {
                commandLine 'pwsh', '-NoProfile', '-File', script.absolutePath,
                        '-OutputRoot', textureOutput.absolutePath
            }
        }
    }
}
