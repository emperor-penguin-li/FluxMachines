name: Build FluxMachines Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build with Gradle using PowerShell 7
        shell: pwsh
        run: .\gradlew.bat build
      
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FluxMachines-Mod
          path: build/libs/*.jar
