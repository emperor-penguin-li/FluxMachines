name: Build FluxMachines Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许在GitHub网页上手动触发

jobs:
  build:
    runs-on: windows-latest  # 使用Windows环境避免纹理生成问题
    
    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 设置Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 构建模组（使用PowerShell 7）
      - name: Build with Gradle
        shell: pwsh
        run: .\gradlew.bat build
      
      # 上传构建产物
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FluxMachines-Mod
          path: build/libs/*.jar
          name: FluxMachines-Mod
          path: build/libs/*.jar
