name: Build FluxMachines Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022  # 明确指定 Windows Server 2022
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'  # 使用 Microsoft 的 OpenJDK
        
      - name: Build
        run: ./gradlew.bat build
        shell: cmd  # 使用 CMD 而不是 PowerShell
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FluxMachines-Mod
          path: build/libs/*.jar
